<main>
  <h1>Seu plano personalizado está a um passo!</h1>
  <a href="/pagina/" id="comecar-quiz">COMEÇAR MEU QUIZ</a>
</main>
<script>
(function(){
  const link=document.getElementById('comecar-quiz');
  if(!link||!location.search)return;
  const target=new URL(link.getAttribute('href'),location.origin);
  const params=new URLSearchParams(location.search);
  for(const [key,value] of params){if(!target.searchParams.has(key))target.searchParams.append(key,value);}
  link.href=target.pathname+target.search+target.hash;
})();
</script>
